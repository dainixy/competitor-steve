# Tests whether repetition overcomes the "companion ignores = not stored" filter.
# Plant WEAK-TYPE facts (no emotional weight) 1x vs 5x.
# Control: single mention with no follow-up.
# Test: same fact repeated 5 times across 50 turns.
# Both probed at d50 after last plant.

