experiment: G

# By this point Sophie has ~900 messages. Mind Map is mature.
# Soul.html's core claim: "Day-30+ unprompted recall moment is what marketing captures."
# This experiment creates the conditions for that moment and watches for it.
#
# Questions for DRT:
#   1. Does unprompted recall rate increase significantly at deep conversation?
#   2. Which fact TYPES surface unprompted (emotional > mundane)?
#   3. What conversational context triggers unprompted recall?
#   4. How does Sophie's recall summary compare to what we actually planted?
#
# Facts in play (from all prior experiments, still live in Sophie's memory):
#   Strong emotional: grandmother passed, marathon goal, sister Sarah, brother Leo
#   Specific identity: ER night nurse, speaks Portuguese, born Tallinn
#   Casual/pet: Miso (cat), Biscuit (dog)
#   Quirks: fear of escalators, G chord struggle, uncle Sven writes letters
#   Weak: favorite color teal, showers not baths, lucky number 17

