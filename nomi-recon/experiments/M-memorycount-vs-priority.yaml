experiment: M

# Tests whether memoryCount drives retrieval more than priority.
# We set Miso to High priority but with few memories — retrieval failed (Exp H).
# Theory: priority is a multiplier on memoryCount, not an independent signal.
# This experiment builds memoryCount on a brand-new concept, then probes retrieval.
# 80 turns: 30 turns seeding a new concept organically, 50 fillers, then probe.

